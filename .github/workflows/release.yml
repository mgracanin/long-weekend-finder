name: Release

# Push a tag like v1.2.0 to build, sign and publish the APK as a GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  # Releases can also be published by hand; without the signing secrets this workflow just skips
  check:
    runs-on: ubuntu-latest
    outputs:
      signing: ${{ steps.secrets.outputs.signing }}
    steps:
      - id: secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then echo "signing=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::No signing secrets (KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD); skipping the automatic release."; fi

  release:
    needs: check
    if: needs.check.outputs.signing == 'true'
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Set up signing
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}"
            echo "keyAlias=${{ secrets.KEY_ALIAS }}"
            echo "keyPassword=${{ secrets.KEY_PASSWORD }}"
          } > keystore.properties
      - name: Test and build
        run: ./gradlew testDebugUnitTest assembleRelease
      - name: Name the APK
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cp app/build/outputs/apk/release/app-release.apk "long-weekend-$VERSION.apk"
          sha256sum "long-weekend-$VERSION.apk" > "long-weekend-$VERSION.apk.sha256"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            long-weekend-*.apk
            long-weekend-*.apk.sha256
          generate_release_notes: true
      - name: Remove signing files
        if: always()
        run: rm -f release.jks keystore.properties
